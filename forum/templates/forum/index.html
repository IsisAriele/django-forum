<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width={device-width}, initial-scale=1.0">
    <title>Topics</title>
    <style>
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Welcome to the django forum!</h1>
    <h3>Comment, discuss or create your own topics</h3>
    <button><a href="{% url 'topic' %}">Create topic</a></button>
    <br><br>
    <button><a href="{% url 'index' %}?my_topics=true">My topics</a></button>
    <button><a href="{% url 'index' %}">All topics</a></button>
    <ul>
        {% for topic in topics %}
            <a href="{% url 'topic-visualization' topic_id=topic.id %}"><li style="padding: 5px;">{{ topic.title }} - Created by: {{ topic.user.username }}</li></a>
        {% endfor %}
    </ul>
</body>
</html>
